spring.application.name=student-management-system
server.port=8080


# ==========================================
# DATABASE - PostgreSQL
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/test_springboot_student-management-system
spring.datasource.username=postgres
spring.datasource.password=root

spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# LOGGING
# ==========================================
logging.level.root=INFO
logging.level.com.example.sms=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n


# =========================================================
# MULTIPART
# =========================================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# =========================================================
# PROFILE IMAGE STORAGE
# =========================================================

file.upload-dir=uploads/student-profile-images


# =========================================================
# Redis cache
# =========================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
# Cache entries expire after 10 minutes so stale catalog data self-heals
spring.cache.redis.time-to-live=600000


# =========================================================
# Swagger / OpenAPI UI at /swagger-ui.html
# =========================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs



# Actuator ? exposed endpoints at /actuator/*. No authentication yet
# (that's added once Spring Security comes into the project), so treat
# these as visible to anyone who can reach this server for now.

#management.endpoints.web.exposure.include=health,info,metrics,loggers

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
info.app.name=Student Management System
info.app.description=Phase 2 ? relationships, caching, auditing, enrollment workflow